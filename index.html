<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just Say It</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5b4cf0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
  <!-- ?v= makes browsers fetch the new file after an update (raise it on each release) -->
  <link rel="stylesheet" href="style.css?v=36">
</head>
<body>
  <!-- Line icons, drawn once and reused with <use href="#i-..."> -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <!-- Halloween variants (h-*): script.js swaps #i-x for #h-x while body.fest-halloween is on -->
    <symbol id="h-wave" viewBox="0 0 24 24"><ellipse cx="12" cy="14" rx="9" ry="7.5" stroke-width="1.7"/><path d="M12 6.5c0-1.5.8-2.5 2-3" stroke-width="1.7"/><path d="M7 12.5l1.8-2.5 1.8 2.5zM13.4 12.5l1.8-2.5 1.8 2.5zM8 15.5h8l-1.3 2.3-1.2-1-1.5 1.5-1.5-1.5-1.2 1z" fill="#ffd27a" stroke="none"/></symbol>
    <symbol id="h-breakdown" viewBox="0 0 24 24"><path d='M12 3v5M12 8L5 20M12 8l7 12M12 8v12M7.5 14q4.5-2 9 0'/></symbol>
    <symbol id="h-timer" viewBox="0 0 24 24"><path d='M7 3h10M7 21h10M8 3c0 5 4 6 4 9s-4 4-4 9M16 3c0 5-4 6-4 9s4 4 4 9'/></symbol>
    <symbol id="h-pencil" viewBox="0 0 24 24"><path d='M20 4c-8 0-13 5-13 12l-3 4M20 4c0 7-5 12-12 12M10 14l6-6'/></symbol>
    <symbol id="h-trash" viewBox="0 0 24 24"><path d='M9 2.5h6L18 9l-3 12.5H9L6 9z'/><path d='M12 8v7M9.5 10.5h5'/></symbol>
    <symbol id="h-history" viewBox="0 0 24 24"><path d='M3.5 12a8.5 8.5 0 1 0 2.5-6'/><path d='M3.5 3.5V8H8'/><path d='M12 9c-3 0-4.5 1.5-4.5 3.5S9 16 12 16s4.5-1.5 4.5-3.5S15 9 12 9z'/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></symbol>
    <symbol id="i-breakdown" viewBox="0 0 24 24"><path d="M4 5h16"/><path d="M7 5v4a3 3 0 0 0 3 3h2"/><path d="M7 9v6.5a3 3 0 0 0 3 3h2"/><path d="M16 12h4M16 18.5h4"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4.5h6V7"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
    <symbol id="i-steps" viewBox="0 0 24 24"><path d="M4 7l1.8 1.8L9 5.5M4 15.5l1.8 1.8L9 14M12.5 7.5H20M12.5 16H20"/></symbol>
    <symbol id="i-paperclip" viewBox="0 0 24 24"><path d="M20 11.5l-8 8a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7L9.7 17.2a1.7 1.7 0 0 1-2.4-2.4L15 7"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 1.5M9.5 3h5"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3.5 3.5V8H8"/><path d="M12 8v4.5l3 2"/></symbol>
  </svg>

  <main class="app">
    <!-- Header: slim glass bar (logo, settings, team), then a greeting with today's summary -->
    <header class="top">
      <!-- Festive decoration (only drawn when body has fest-halloween): edges only, ignores clicks -->
      <div class="fest-decor" aria-hidden="true"><span class="moon"></span><span class="web"></span><span class="hang sp"></span><span class="hang b1"></span><span class="hang b2"></span></div>
      <div class="topbar">
        <span class="brand">
          <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-wave"/></svg></span>
          <span data-i18n="title">Just Say It</span>
        </span>
        <div class="top-actions">
          <!-- On phones these three fold into the "more" (three dots) menu -->
          <div class="quick" id="quick">
            <button id="lang" class="ib" title="Language">TH</button>
            <button id="theme" class="ib" title="Dark mode" aria-label="Dark mode"><svg class="i"><use href="#i-moon"/></svg></button>
            <button id="repeat" class="ib" title="Remind again" aria-label="Remind again"></button>
            <button id="notify" class="ib" title="Reminders" aria-label="Reminders"><svg class="i"><use href="#i-bell"/></svg></button>
          </div>
          <!-- Team pill: filled from status.json; stays hidden where there is none (GitHub Pages) -->
          <a href="status.html" class="team" id="team" title="Team status" aria-label="Team status" hidden>
            <span class="avs" id="team-avs"></span><span data-i18n="team">Team</span><small id="team-working"></small><span class="team-dot" id="team-dot" hidden></span>
          </a>
          <button id="more" class="ib only-phone" title="More" aria-label="More" aria-expanded="false" aria-controls="quick"><svg class="i"><use href="#i-dots"/></svg></button>
        </div>
      </div>
      <h1 class="greet" id="greet">Hello</h1>
      <p class="summary"><span id="summary"></span>
        <!-- Max (the AI assistant): green dot = ready, grey = offline. Opens Max's card on the status page -->
        <a href="status.html#max" class="max-status" id="max-status"><i></i><span id="max-text">Max</span></a>
      </p>
      <p class="fest-line" id="fest-line" data-i18n="festHalloween"></p>
    </header>

    <!-- Command bar: add a task, or change one ("move #2 to friday", "done #3", "delete laundry") -->
    <!-- AI fills in date, priority and category -->
    <form id="todo-form" class="card add">
      <!-- Hint text: rotating examples from hints.json drawn by hints.js (a real placeholder can't fade) -->
      <div class="hint-field"><input id="todo-input" type="text" aria-label="Tell Max" placeholder=" " autocomplete="off" required><span class="hint-ph" aria-hidden="true"></span></div>
      <button type="submit" id="add-btn" class="primary" data-i18n="add">Go</button>
    </form>
    <p id="pending-bar" class="cmd-msg" role="status"></p> <!-- "Answering Max: …" while Max waits for more words -->
    <p id="cmd-msg" class="cmd-msg" role="status"></p>
    <!-- Ask Max: the answer to a question about the tasks (filled in by script.js) -->
    <div id="answer-card" class="card answer-card" role="region" aria-live="polite" hidden></div>
    <datalist id="cat-list"></datalist>

    <!-- How much AI the app used today, against a daily limit you choose -->
    <button id="usage" class="usage" title="Click to change the daily limit">
      <span class="usage-label"><span data-i18n="aiToday">AI used today</span> <b id="usage-text"></b></span>
      <span class="usage-bar"><span id="usage-fill"></span></span>
    </button>

    <!-- Search, filters, sort -->
    <div class="toolbar">
      <input id="search" type="search" data-i18n-ph="search" placeholder="Search tasks…">
      <select id="sort">
        <option value="manual" data-i18n="sortManual">My order</option>
        <option value="due" data-i18n="sortDue">Due date</option>
        <option value="priority" data-i18n="sortPriority">Priority</option>
      </select>
    </div>
    <div class="chips" id="filters">
      <button class="chip active" data-filter="all" data-i18n="all">All</button>
      <button class="chip" data-filter="active" data-i18n="active">Active</button>
      <button class="chip" data-filter="done" data-i18n="done">Done</button>
      <button class="chip" data-filter="overdue" data-i18n="overdue">Overdue</button>
    </div>
    <div class="chips" id="cat-filters"></div>
    <div class="chips" id="num-filter" hidden></div>

    <ul id="todo-list" class="card list"></ul>

    <footer>
      <span id="counter"></span>
      <button id="fest-toggle" class="link" type="button"></button>
      <button id="clear-done" class="link" data-i18n="clear">Clear done</button>
    </footer>
    <!-- "Clear done" asks Yes/No here, next to the button -->
    <p id="foot-msg" class="cmd-msg" role="status"></p>

    <!-- Backups: the app also backs up by itself before changes (needs server.py) -->
    <details class="backup-menu">
      <summary class="link"><svg class="i" aria-hidden="true"><use href="#i-history"/></svg><span data-i18n="backupMenu">Backup</span></summary>
      <div class="chips">
        <button id="backup-now" class="chip" data-i18n="backupNow" title="File attachments are not included">Back up now</button>
        <button id="restore" class="chip" data-i18n="restore">Restore…</button>
        <button id="export" class="chip" data-i18n="exportFile" title="File attachments are not included">Export file</button>
        <button id="import" class="chip" data-i18n="importFile">Import file</button>
        <input id="import-file" type="file" accept=".json,application/json" hidden>
      </div>
      <p class="backup-note" data-i18n="backupNote">Your tasks are backed up automatically before changes. File attachments are not included.</p>
      <p id="backup-msg" class="cmd-msg" role="status"></p>
      <div id="backup-list" class="chips backup-list"></div>
    </details>
  </main>

  <!-- Reminder banner: works where system notifications don't (iPhone over Tailscale). Fixed at the TOP so it never covers the focus bar below -->
  <div id="remind-bar" class="focus-bar remind-bar" role="alert" hidden>
    <svg class="i" aria-hidden="true"><use href="#i-bell"/></svg>
    <div class="focus-info"><div id="remind-head" class="remind-head"></div><div id="remind-title" class="focus-title"></div></div>
    <div id="remind-main" class="focus-btns">
      <button id="remind-done" class="chip active" type="button"></button>
      <button id="remind-snooze" class="chip" type="button" aria-expanded="false"></button>
      <button id="remind-close" class="ib" type="button"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div id="remind-opts" class="focus-btns remind-opts" hidden>
      <button class="chip" type="button" data-snooze="10"></button>
      <button class="chip" type="button" data-snooze="60"></button>
      <button class="chip" type="button" data-snooze="tomorrow"></button>
    </div>
  </div>

  <!-- Focus timer bar: outside the task list on purpose (the list is redrawn often); script.js fills it in -->
  <div id="focus-bar" class="focus-bar" role="status" hidden>
    <svg class="i" aria-hidden="true"><use href="#i-timer"/></svg>
    <div class="focus-info"><div id="focus-title" class="focus-title"></div><div id="focus-time" class="focus-time"></div></div>
    <div id="focus-run" class="focus-btns">
      <button id="focus-pause" class="ib" type="button"></button>
      <button id="focus-plus" class="ib focus-plus" type="button"></button>
      <button id="focus-stop" class="ib" type="button"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div id="focus-end" class="focus-btns" hidden>
      <button id="focus-done" class="chip active" type="button"></button>
      <button id="focus-later" class="chip" type="button"></button>
    </div>
    <span id="focus-fill" class="focus-fill" aria-hidden="true"></span>
  </div>

  <script src="hints.js?v=1"></script>
  <script src="script.js?v=42"></script>
</body>
</html>
