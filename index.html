<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>My To-Do List</h1>

    <!-- Form: type a task and press Enter or click Add -->
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="What do you need to do?" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>

    <!-- Filter buttons -->
    <div class="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="active">Active</button>
      <button class="filter" data-filter="done">Done</button>
    </div>

    <!-- Tasks are added here by script.js -->
    <ul id="todo-list"></ul>

    <footer>
      <span id="counter">0 tasks left</span>
      <button id="clear-done">Clear done</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
