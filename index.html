<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <h1 data-i18n="title">My Tasks</h1>
        <p class="sub" id="today"></p>
      </div>
      <div class="top-actions">
        <button id="lang" class="icon-btn" title="Language">TH</button>
        <button id="theme" class="icon-btn" title="Dark mode">🌙</button>
        <button id="notify" class="icon-btn" title="Reminders">🔔</button>
      </div>
    </header>

    <!-- Add a task -->
    <!-- Type anything and press Enter: AI fills in date, priority and category -->
    <form id="todo-form" class="card add">
      <input id="todo-input" type="text" data-i18n-ph="placeholder" placeholder="e.g. pay rent on the 5th of next month, urgent" autocomplete="off" required>
      <button type="submit" id="add-btn" class="primary" data-i18n="add">✨ Add</button>
    </form>
    <datalist id="cat-list"></datalist>

    <!-- How much AI the app used today, against a daily limit you choose -->
    <button id="usage" class="usage" title="Click to change the daily limit">
      <span class="usage-label"><span data-i18n="aiToday">AI used today</span> <b id="usage-text"></b></span>
      <span class="usage-bar"><span id="usage-fill"></span></span>
    </button>

    <!-- Search, filters, sort -->
    <div class="toolbar">
      <input id="search" type="search" data-i18n-ph="search" placeholder="Search tasks…">
      <select id="sort">
        <option value="manual" data-i18n="sortManual">My order</option>
        <option value="due" data-i18n="sortDue">Due date</option>
        <option value="priority" data-i18n="sortPriority">Priority</option>
      </select>
    </div>
    <div class="chips" id="filters">
      <button class="chip active" data-filter="all" data-i18n="all">All</button>
      <button class="chip" data-filter="active" data-i18n="active">Active</button>
      <button class="chip" data-filter="done" data-i18n="done">Done</button>
      <button class="chip" data-filter="overdue" data-i18n="overdue">Overdue</button>
    </div>
    <div class="chips" id="cat-filters"></div>

    <ul id="todo-list" class="card list"></ul>

    <footer>
      <span id="counter"></span>
      <button id="clear-done" class="link" data-i18n="clear">Clear done</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
